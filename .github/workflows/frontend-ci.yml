name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benkuhman.Client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: benkuhman.Client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Upload website
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-web
          path: benkuhman.Client/dist/benkuhman/browser/
          if-no-files-found: error
          retention-days: 7
